services:
  # API Gateway
  api-gateway:
    build: ./api_gateway
    ports:
      - "8080:8080"
    environment:
      SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
      - model_catalog_service
      - upload_download_service
    networks:
      - rllabs-network

  # Model Catalog Service (AP System)
  model_catalog_service:
    build:
      context: ./model_catalog_service
    container_name: model_catalog_service
    # Expose for local tests hitting localhost:8001
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://rllabs:rllabs_password@postgres/model_catalog_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=admin_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rllabs-network
    volumes:
      - ./model_catalog_service:/app

  # Upload/Download Service
  upload_download_service:
    build:
      context: ./upload_download_service
    container_name: upload_download_service
    # Expose for local tests hitting localhost:8002
    ports:
      - "8002:8002"
    environment:
      # MinIO Configuration
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin_password
      - MINIO_BUCKET=models
      - MINIO_USE_SSL=false
      # PostgreSQL Configuration
      - DATABASE_URL=postgresql://rllabs:rllabs_password@postgres/upload_download_db
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # RabbitMQ Configuration
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=admin_password
      # Service URLs
      - MODEL_CATALOG_URL=http://model_catalog_service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - rllabs-network
    volumes:
      - ./upload_download_service:/app

  # PostgreSQL Database for Model Catalog Service (Metadata)
  postgres:
    image: postgres:13
    container_name: postgres_db
    environment:
      POSTGRES_USER: rllabs
      POSTGRES_PASSWORD: rllabs_password
      POSTGRES_DB: model_catalog_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rllabs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rllabs"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Initialize additional databases
  db-init:
    image: postgres:13
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rllabs-network
    environment:
      PGPASSWORD: rllabs_password
    entrypoint: >
      /bin/sh -c "
      psql -h postgres -U rllabs -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'upload_download_db'\" | grep -q 1 || psql -h postgres -U rllabs -d postgres -c \"CREATE DATABASE upload_download_db;\";
      echo 'Database initialization complete';
      exit 0;
      "

  # Redis for Caching and Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - rllabs-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ for Asynchronous Messaging
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_messaging
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin_password
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    networks:
      - rllabs-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for S3-compatible Object Storage (Model Files)
  minio:
    image: minio/minio:latest
    container_name: minio_storage
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    volumes:
      - minio_data:/data
    networks:
      - rllabs-network
    command: server /data --console-address ":9001"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # A one-off service to create the MinIO bucket
  create-buckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - rllabs-network
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set rllabs_minio http://minio:9000 minioadmin minioadmin_password;
      /usr/bin/mc mb rllabs_minio/models;
      /usr/bin/mc policy set public rllabs_minio/models;
      exit 0;
      "

networks:
  rllabs-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data: