# RLLabs Docker Compose Configuration
# ====================================
# SECURITY ARCHITECTURE:
# - All application services (Model Catalog, Upload/Download, Collaboration) are NOT directly exposed
# - All client requests must go through the API Gateway (port 8080)
# - This enforces centralized authentication, rate limiting, circuit breakers, and user context propagation
#
# INFRASTRUCTURE SERVICES SECURITY:
# - PostgreSQL (5432), Redis (6379), RabbitMQ (5672/15672), MongoDB (27017-27019):
#   * NOT exposed to host network (aligned with Kubernetes security model)
#   * Only accessible within Docker network via service names (e.g., postgres:5432)
#   * For debugging: Use "docker compose exec <service> <command>" or create temporary port-forward
#   * This matches production deployment patterns where services are cluster-internal only
#   * Future: Implement mTLS for inter-service communication in production deployments
#
# - MinIO (9000/9001):
#   * MUST be exposed for presigned URL direct client-to-storage transfers
#   * Authorization happens BEFORE presigned URL generation (secure)
#   * Clients download directly from MinIO after receiving authorized presigned URLs
#   * This is an architectural requirement for performance (bypasses backend bottleneck)
#   * Future: Consider MinIO behind reverse proxy with TLS, IP allowlisting, shorter URL expiration

services:
  # API Gateway - Single Entry Point for All Client Requests
  api-gateway:
    build:
      context: .
      dockerfile: ./api_gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
      - model-catalog-service
      - upload-download-service
      - collaboration-service
    networks:
      - rllabs-network

  # Model Catalog Service (AP System)
  # SECURITY: Not exposed directly - all access must go through API Gateway (port 8080)
  # This enforces centralized authentication, rate limiting, and circuit breakers
  model-catalog-service:
    build:
      context: .
      dockerfile: ./model_catalog_service/Dockerfile
    container_name: model-catalog-service
    # No ports exposed - accessible only via internal Docker network through API Gateway
    environment:
      - DATABASE_URL=postgresql://rllabs:rllabs_password@postgres/model_catalog_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=admin_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rllabs-network
    volumes:
      - ./model_catalog_service:/app

  # Upload/Download Service
  # SECURITY: Not exposed directly - all access must go through API Gateway (port 8080)
  # This enforces centralized authentication, rate limiting, and circuit breakers
  upload-download-service:
    build:
      context: .
      dockerfile: ./upload_download_service/Dockerfile
    container_name: upload-download-service
    # No ports exposed - accessible only via internal Docker network through API Gateway
    environment:
      # MinIO Configuration
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin_password
      - MINIO_BUCKET=models
      - MINIO_USE_SSL=false
      # PostgreSQL Configuration
      - DATABASE_URL=postgresql://rllabs:rllabs_password@postgres/upload_download_db
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # RabbitMQ Configuration
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=admin_password
      # Service URLs
      - MODEL_CATALOG_URL=http://model-catalog-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - rllabs-network
    volumes:
      - ./upload_download_service:/app

  # Training Service
  model-train-service:
    build:
      context: .
      dockerfile: ./model_train_service/Dockerfile
    container_name: model-train-service
    environment:
      # Upload/Download Service URL for downloading artifacts
      - UPLOAD_DOWNLOAD_SERVICE_URL=http://upload-download-service:8002
      # RabbitMQ Configuration
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=admin_password
      - RABBITMQ_QUEUE=training_jobs
      # Redis Configuration for Job Status Tracking
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      upload-download-service:
        condition: service_started
    networks:
      - rllabs-network
    volumes:
      - ./model_train_service:/app

  # PostgreSQL Database for Model Catalog Service (Metadata) and Upload/Download
  # SECURITY: Not exposed to host - accessible only within Docker network
  # For debugging: docker compose exec postgres_db psql -U rllabs -d model_catalog_db
  postgres:
    image: postgres:13
    container_name: postgres_db
    environment:
      POSTGRES_USER: rllabs
      POSTGRES_PASSWORD: rllabs_password
      POSTGRES_DB: model_catalog_db
      POSTGRES_MULTIPLE_DATABASES: upload_download_db
      # CRITICAL: Increase max_connections to handle connection pools from multiple services
      # With connection pools of 40 per pod, we need at least 300 connections
      # to account for multiple pods, read replicas, and system overhead
      POSTGRES_MAX_CONNECTIONS: "300"
    # No ports exposed - accessible only via internal Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init/create-multiple-databases.sh:/docker-entrypoint-initdb.d/create-multiple-databases.sh
    networks:
      - rllabs-network
    healthcheck:
      # Use default database (postgres) for health check - pg_isready doesn't need a specific DB
      test: ["CMD-SHELL", "pg_isready -U rllabs -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Caching and Rate Limiting
  # SECURITY: Not exposed to host - accessible only within Docker network
  # For debugging: docker compose exec redis_cache redis-cli
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    # No ports exposed - accessible only via internal Docker network
    networks:
      - rllabs-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ for Asynchronous Messaging
  # SECURITY: Not exposed to host - accessible only within Docker network
  # For debugging: 
  #   - CLI: docker compose exec rabbitmq_messaging rabbitmq-diagnostics status
  #   - Management UI: docker compose port rabbitmq 15672 (then access returned port)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_messaging
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin_password
    # No ports exposed - accessible only via internal Docker network
    # Volume temporarily removed due to macOS Docker Desktop permission issues
    # Uncomment below and remove volume if you need persistence:
    # volumes:
    #   - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - rllabs-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for S3-compatible Object Storage (Model Files)
  minio:
    image: minio/minio:latest
    container_name: minio_storage
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    volumes:
      - minio_data:/data
    networks:
      - rllabs-network
    command: server /data --console-address ":9001" --address ":9000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # A one-off service to create the MinIO bucket
  create-buckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - rllabs-network
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set rllabs_minio http://minio:9000 minioadmin minioadmin_password;
      /usr/bin/mc mb rllabs_minio/models;
      /usr/bin/mc policy set public rllabs_minio/models;
      exit 0;
      "

  # Frontend Dev - Vite dev server with hot reload (for development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - rllabs-network

  # Frontend Production (optional - for production builds)
  # Uncomment to use production build with nginx instead of Vite dev server
  # frontend-prod:
  #   build:
  #     context: ./frontend
  #     args:
  #       VITE_API_BASE_URL: http://localhost:8080
  #   container_name: frontend-prod
  #   ports:
  #     - "5173:80"
  #   depends_on:
  #     api-gateway:
  #       condition: service_started
  #   networks:
  #     - rllabs-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # MongoDB Replica Set for Collaboration Service (CP Configuration)
  # SECURITY: Not exposed to host - accessible only within Docker network
  # For debugging: docker compose exec mongo1 mongosh --port 27017
  mongo1:
    image: mongo:7.0
    container_name: mongo1
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    # No ports exposed - accessible only via internal Docker network
    volumes:
      - mongo1_data:/data/db
      - mongo1_config:/data/configdb
    networks:
      - rllabs-network
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo1:27017',priority:1},{_id:1,host:'mongo2:27018',priority:0.5},{_id:2,host:'mongo3:27019',priority:0.5}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30

  mongo2:
    image: mongo:7.0
    container_name: mongo2
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    # No ports exposed - accessible only via internal Docker network
    volumes:
      - mongo2_data:/data/db
      - mongo2_config:/data/configdb
    networks:
      - rllabs-network
    depends_on:
      - mongo1

  mongo3:
    image: mongo:7.0
    container_name: mongo3
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27019"]
    # No ports exposed - accessible only via internal Docker network
    volumes:
      - mongo3_data:/data/db
      - mongo3_config:/data/configdb
    networks:
      - rllabs-network
    depends_on:
      - mongo1

  # Collaboration Service
  # SECURITY: Not exposed directly - all access must go through API Gateway (port 8080)
  # This enforces centralized authentication, rate limiting, and circuit breakers
  collaboration-service:
    build:
      context: .
      dockerfile: ./collaboration_service/dockerfile
    container_name: collaboration-service
    # No ports exposed - accessible only via internal Docker network through API Gateway
    environment:
      - MONGO_URI=mongodb://mongo1:27017,mongo2:27018,mongo3:27019/?replicaSet=rs0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=admin_password
      - MODEL_CATALOG_URL=http://model-catalog-service:8000
    depends_on:
      mongo1:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rllabs-network
    volumes:
      - ./collaboration_service:/app

networks:
  rllabs-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  mongo1_config:
  mongo2_config:
  mongo3_config: