kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  # HTTP for Ingress (primary external access method)
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  # HTTPS for Ingress (for TLS termination)
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  # NodePort range removed - using Ingress-only architecture for better security
- role: worker
- role: worker
- role: worker