---
# Ingress for MinIO API (port 9000)
# Allows external access to MinIO for presigned URL uploads/downloads
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"  
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"  
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    # Preserve the original Host header for presigned URL signature validation
    # This is critical - presigned URLs are signed with the Host header, so it must match exactly
    nginx.ingress.kubernetes.io/upstream-vhost: "minio.localhost"
    # Enable CORS for browser uploads
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, HEAD, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Content-Length, Authorization, X-Amz-*, x-amz-*, *"
    nginx.ingress.kubernetes.io/cors-expose-headers: "ETag, etag"
    nginx.ingress.kubernetes.io/cors-max-age: "3600"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: minio.localhost 
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
---
# Ingress for MinIO Console (port 9001) - optional
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-console-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: minio-console.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9001

