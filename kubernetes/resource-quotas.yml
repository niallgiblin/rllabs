# Resource Quotas and Limit Ranges
# Demonstrates resource management in distributed systems
#
# ResourceQuota: Limits total resources per namespace
# LimitRange: Sets default requests/limits for pods
#
# Quota calculations (at max HPA scale):
# - Application services: ~20 CPU requests, ~21Gi memory (API Gateway: 20×, Model Catalog: 15×, Upload-Download: 20×, Collaboration: 15×, Model Train: 5×)
# - Infrastructure: ~2.5 CPU requests, ~3.5Gi memory (Postgres HA, Redis HA, RabbitMQ, MongoDB, MinIO, Observability)
# - Total: ~22.5 CPU requests, ~24.5Gi memory
# - Quota set to 25 CPU / 30Gi to allow headroom for system pods and scaling

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: rllabs-quota
spec:
  hard:
    requests.cpu: "25"      
    requests.memory: "30Gi"  
    limits.cpu: "50"         
    limits.memory: "60Gi"   
    persistentvolumeclaims: "10"  
    pods: "90"                        

---
apiVersion: v1
kind: LimitRange
metadata:
  name: rllabs-limits
spec:
  limits:
    - default:          
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:  
        cpu: "100m"
        memory: "128Mi"
      max:             
        cpu: "2"
        memory: "4Gi"
      min:              
        cpu: "50m"
        memory: "64Mi"
      type: Container
