# MinIO Distributed Mode Configuration
# 4-node distributed deployment for erasure coding
# Demonstrates: Distributed object storage, erasure coding, data redundancy

---
# MinIO Headless Service for inter-node communication
apiVersion: v1
kind: Service
metadata:
  name: minio-hl
spec:
  clusterIP: None
  selector:
    app: minio
  ports:
    - port: 9000
      name: api
    - port: 9001
      name: console

---
# MinIO External Service (for applications to connect)
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  type: ClusterIP  # Changed from LoadBalancer for kind compatibility
  selector:
    app: minio
  ports:
    - port: 9000
      name: api
      targetPort: 9000
    - port: 9001
      name: console
      targetPort: 9001

---
# MinIO StatefulSet for distributed mode
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio-hl
  replicas: 4
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      # Init container to ensure DNS is ready before starting MinIO
      initContainers:
        - name: wait-for-dns
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for DNS to be ready..."
              for i in 0 1 2 3; do
                until nslookup minio-${i}.minio-hl.default.svc.cluster.local; do
                  echo "Waiting for DNS resolution for minio-${i}..."
                  sleep 2
                done
                echo "minio-${i} DNS is ready"
              done
              echo "All MinIO DNS entries are ready!"
      containers:
        - name: minio
          image: minio/minio:latest
          args:
            - server
            - http://minio-{0...3}.minio-hl.default.svc.cluster.local:9000/data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              value: "minioadmin"
            - name: MINIO_ROOT_PASSWORD
              value: "minioadmin_password"
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: "public"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

---
# Job to create buckets in distributed MinIO
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-buckets
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MinIO cluster to be ready..."
              # Wait for all 4 nodes to be accessible
              for i in 0 1 2 3; do
                until nc -z minio-${i}.minio-hl.default.svc.cluster.local 9000; do
                  echo "Waiting for minio-${i}..."
                  sleep 5
                done
                echo "minio-${i} is ready"
              done
              echo "All MinIO nodes are ready!"
              # Wait additional time for cluster to fully initialize
              echo "Waiting for cluster to initialize..."
              sleep 15
              # Verify cluster is accessible via the service
              until nc -z minio.default.svc.cluster.local 9000; do
                echo "Waiting for MinIO service..."
                sleep 2
              done
              echo "MinIO service is ready!"
      containers:
        - name: create-buckets
          image: minio/mc:latest
          command:
            - sh
            - -c
            - |
              # Configure MinIO client - use the regular service (not headless) for client operations
              # The regular service will route to the distributed cluster
              mc alias set myminio http://minio.default.svc.cluster.local:9000 minioadmin minioadmin_password
              
              # Create buckets
              mc mb myminio/models --ignore-existing
              mc mb myminio/artifacts --ignore-existing
              mc mb myminio/training-data --ignore-existing
              
              # Set bucket policies
              mc anonymous set download myminio/models
              
              echo "Buckets created successfully!"
              mc ls myminio/

