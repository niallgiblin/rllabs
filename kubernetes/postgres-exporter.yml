# PostgreSQL Exporter for Prometheus Monitoring
# Exposes metrics for replication lag, connection stats, and database health

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          ports:
            - containerPort: 9187
              name: metrics
          env:
            # Connection to primary PostgreSQL
            - name: DATA_SOURCE_NAME
              value: "postgresql://rllabs:rllabs_password@postgres-primary:5432/model_catalog_db?sslmode=disable"
            # Also monitor upload_download_db
            - name: PG_EXPORTER_EXTEND_QUERY_PATH
              value: "/etc/postgres-exporter/queries.yaml"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: queries
              mountPath: /etc/postgres-exporter
      volumes:
        - name: queries
          configMap:
            name: postgres-exporter-queries
---
# ConfigMap with custom queries for replication metrics
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-queries
data:
  queries.yaml: |
    pg_replication:
      query: |
        SELECT
          CASE WHEN NOT pg_is_in_recovery() THEN 0 ELSE GREATEST (0, EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp()))) END
            AS lag,
          pg_is_in_recovery()::int AS is_replica,
          pg_last_xact_replay_timestamp() AS last_replay
        WHERE current_setting('server_version_num')::int >= 100000
      master: true
      metrics:
        - lag:
            usage: "GAUGE"
            description: "Replication lag behind master in seconds"
        - is_replica:
            usage: "GAUGE"
            description: "1 if this is a replica, 0 if primary"
        - last_replay:
            usage: "GAUGE"
            description: "Timestamp of last replayed transaction"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
spec:
  selector:
    app: postgres-exporter
  ports:
    - protocol: TCP
      port: 9187
      targetPort: 9187

