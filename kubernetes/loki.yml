# Loki + Promtail Deployment
# ===========================
# Centralized logging stack that integrates with Grafana.
#
# Components:
# - Loki: Log aggregation system (like Prometheus, but for logs)
# - Promtail: Agent that collects logs from pods and sends to Loki
#
# Features:
# - Labels-based indexing (efficient queries)
# - LogQL query language (similar to PromQL)
# - Native Grafana integration
# - Automatic log collection from all pods
#
# Access:
# - Loki API: http://loki:3100 (used by Grafana)
# - Logs in Grafana: Add Loki datasource, then use Explore

# ================================
# Loki Server
# ================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
data:
  loki-config.yaml: |
    auth_enabled: false
    
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    
    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100
    
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    
    ruler:
      alertmanager_url: http://alertmanager:9093
    
    # Limits for development (increase for production)
    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_entries_limit_per_query: 5000
      # Increase ingestion rate limit to handle high log volume
      ingestion_rate_mb: 50
      ingestion_burst_size_mb: 100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:2.9.2
          args:
            - "-config.file=/etc/loki/loki-config.yaml"
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
            - name: grpc
              containerPort: 9096
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki
            - name: loki-storage
              mountPath: /loki
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: loki-config
          configMap:
            name: loki-config
        - name: loki-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    app: loki
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      protocol: TCP
  type: ClusterIP

---
# ================================
# Promtail Agent (DaemonSet)
# ================================
# Runs on every node and collects logs from all pods
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
data:
  promtail-config.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    
    positions:
      filename: /tmp/positions.yaml
    
    clients:
      - url: http://loki:3100/loki/api/v1/push
        batchwait: 2s
        batchsize: 524288
        timeout: 10s
        backoff_config:
          min_period: 500ms
          max_period: 5s
          max_retries: 10
    
    scrape_configs:
      # Static file-based config to collect logs from all pods
      # This works immediately while we debug Kubernetes discovery
      - job_name: all-pods
        static_configs:
          - targets:
              - localhost
            labels:
              job: kubernetes-pods
              __path__: /var/log/pods/*/*/*.log
        
        pipeline_stages:
          # Extract pod info from file path - this MUST succeed for labels
          - regex:
              expression: '/var/log/pods/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<pod_uid>[^/]+)/(?P<container>[^/]+)/'
          
          # Set labels from path - these are required
          - labels:
              namespace:
              pod_name: pod
              container:
          
          # Try to parse JSON logs if present (non-blocking)
          - json:
              expressions:
                level: level
                service: service
                message: message
                trace_id: trace_id
              drop_malformed: false
          
          # Set labels from parsed JSON (only if they exist)
          - labels:
              level:
              service:
              trace_id:
      
      # Scrape logs from all pods using Kubernetes discovery
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        
        pipeline_stages:
          # Try to parse JSON logs if present, otherwise pass through
          - json:
              expressions:
                level: level
                service: service
                trace_id: trace_id
                span_id: span_id
                user_id: user_id
                message: message
              drop_malformed: true
          
          # Set labels from parsed JSON (only if they exist)
          - labels:
              level:
              service:
              trace_id:
        
        relabel_configs:
          # Keep only running pods FIRST (before other operations)
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          
          # Drop Promtail's own logs to avoid recursion
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: drop
            regex: promtail
          
          # Construct log file path
          # Format: /var/log/pods/<namespace>_<pod-name>_<pod-uid>/<container-name>/*.log
          - action: replace
            source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_pod_name
              - __meta_kubernetes_pod_uid
            separator: _
            target_label: __tmp_kubernetes_pod_path
          - action: replace
            source_labels:
              - __tmp_kubernetes_pod_path
              - __meta_kubernetes_pod_container_name
            separator: /
            target_label: __path__
            replacement: /var/log/pods/$1/$2/*.log
          
          # Use pod namespace as label
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          
          # Use pod name as label
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          
          # Use container name as label
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          
          # Use app label if available
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
      
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: default
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:2.9.2
          args:
            - "-config.file=/etc/promtail/promtail-config.yaml"
          ports:
            - name: http
              containerPort: 9080
              protocol: TCP
          volumeMounts:
            - name: promtail-config
              mountPath: /etc/promtail
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlib
              mountPath: /var/lib
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      volumes:
        - name: promtail-config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlib
          hostPath:
            path: /var/lib
---
# Service for Promtail (for metrics and debugging)
apiVersion: v1
kind: Service
metadata:
  name: promtail
  labels:
    app: promtail
spec:
  selector:
    app: promtail
  ports:
    - name: http
      port: 9080
      targetPort: 9080
      protocol: TCP
  type: ClusterIP

