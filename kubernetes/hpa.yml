# Horizontal Pod Autoscalers for auto-scaling based on CPU and memory metrics
# These will automatically scale pods up/down based on resource usage
#
# Notes on scaling thresholds:
# - CPU-bound services (api-gateway): Scale at 70% CPU
# - I/O-bound services (model-catalog, collaboration): Scale earlier (50% CPU)
#   because they spend time waiting on DB/network, not using CPU
# - Services with higher baseline traffic get higher minReplicas
#
# OPTIMIZED FOR FASTER SCALING:
# - Increased maxReplicas for high-traffic services (API Gateway, Upload-Download)
# - More aggressive scale-up policies (scale faster, more pods at once)
# - Faster scale-down policies (reduce costs when load decreases)

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2  
  maxReplicas: 30  # Increased from 20 to allow higher throughput  
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60  # Raised to 60% to prevent maxing out too fast
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60  # Lowered from 80% for demo visibility
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 15  # Reduced from 30s for faster scale-down in demo
      policies:
        - type: Percent
          value: 50  # Scale down by up to 50% at a time
          periodSeconds: 15  # Reduced from 30s for faster scale-down
        - type: Pods
          value: 2  # Or remove up to 2 pods at once
          periodSeconds: 15  # Reduced from 30s for faster scale-down
      selectPolicy: Max
    scaleUp:
      stabilizationWindowSeconds: 60  # Wait 60s before scaling up to prevent rapid scaling on brief spikes
      policies:
        - type: Percent
          value: 100  # Can double pods (reduced from 200% to prevent over-scaling)
          periodSeconds: 30  # Every 30s instead of 10s for more controlled scaling
        - type: Pods
          value: 3  # Or add up to 3 pods at once (reduced from 6)
          periodSeconds: 30  # Every 30s instead of 10s
      selectPolicy: Max  # Use the policy that allows the most scaling  

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-catalog-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-catalog-service
  minReplicas: 2  
  maxReplicas: 20  # Increased from 15 to allow higher throughput  
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 15  # Lowered to 15% to trigger scaling (I/O-bound service needs more concurrent requests)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60  # Raised from 45% to allow faster scale-down (memory was preventing scale-down)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 15  # Reduced from 30s for faster scale-down in demo
      policies:
        - type: Percent
          value: 50
          periodSeconds: 15  # Reduced from 30s for faster scale-down
        - type: Pods
          value: 2  
          periodSeconds: 15  # Reduced from 30s for faster scale-down
      selectPolicy: Max
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
        - type: Percent
          value: 300  # Can quadruple pods quickly
          periodSeconds: 10  # Fast: every 10s
        - type: Pods
          value: 8  # Or add up to 8 pods at once (increased from 5)
          periodSeconds: 10  # Fast: every 10s
      selectPolicy: Max

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: upload-download-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: upload-download-service
  minReplicas: 1  
  maxReplicas: 25  # Increased from 20 to allow higher throughput  
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 20  # Lowered to 20% to trigger scaling (I/O-bound service)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60  # Raised from 45% to allow scale-down (memory was preventing scale-down at 44%) 
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 15  # Reduced from 30s for faster scale-down in demo
      policies:
        - type: Percent
          value: 50
          periodSeconds: 15  # Reduced from 30s for faster scale-down
        - type: Pods
          value: 2  
          periodSeconds: 15  # Reduced from 30s for faster scale-down
      selectPolicy: Max  
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
        - type: Percent
          value: 300  # Can quadruple pods quickly
          periodSeconds: 10  # Fast: every 10s
        - type: Pods
          value: 8  # Or add up to 8 pods at once (increased from 6)
          periodSeconds: 10  # Fast: every 10s
      selectPolicy: Max


---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: collaboration-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: collaboration-service
  minReplicas: 1  
  maxReplicas: 15  # Reduced from 20 to prevent over-scaling and resource contention
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60  # Raised to 60% to allow scale-down (CPU was stuck at 57% preventing scale-down)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 45  # Lowered further for demo visibility
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 15  # Reduced from 30s for faster scale-down in demo
      policies:
        - type: Percent
          value: 50
          periodSeconds: 15  # Reduced from 30s for faster scale-down
        - type: Pods
          value: 2
          periodSeconds: 15  # Reduced from 30s for faster scale-down
      selectPolicy: Max
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
        - type: Percent
          value: 300  # Can quadruple pods quickly (increased from 150%)
          periodSeconds: 10  # Faster: every 10s instead of 15s
        - type: Pods
          value: 8  # Or add up to 8 pods at once (increased from 3)
          periodSeconds: 10  # Faster: every 10s instead of 15s
      selectPolicy: Max

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-train-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-train-service
  minReplicas: 1 
  maxReplicas: 5 
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80  
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85 
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  
      policies:
        - type: Percent
          value: 50
          periodSeconds: 120
      selectPolicy: Min 
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 1 
          periodSeconds: 60
      selectPolicy: Max
