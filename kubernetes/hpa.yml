---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: model-train-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-train-service
  minReplicas: 1 
  maxReplicas: 5 
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80  
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85 
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  
      policies:
        - type: Percent
          value: 50
          periodSeconds: 120
      selectPolicy: Min 
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 1 
          periodSeconds: 60
      selectPolicy: Max
