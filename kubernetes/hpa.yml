    name: model-catalog-service
  minReplicas: 3  
  maxReplicas: 15  
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50  
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30  
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30  
        - type: Pods
          value: 2  
          periodSeconds: 30
      selectPolicy: Max
    scaleUp:
      stabilizationWindowSeconds: 0  
      policies:
        - type: Percent
          value: 200  
          periodSeconds: 10  
        - type: Pods
          value: 5 
          periodSeconds: 10  
      selectPolicy: Max

