# Horizontal Pod Autoscalers for auto-scaling based on CPU and memory metrics
# These will automatically scale pods up/down based on resource usage
#
# Notes on scaling thresholds:
# - CPU-bound services (api-gateway): Scale at 70% CPU
# - I/O-bound services (model-catalog, collaboration): Scale earlier (50% CPU)
#   because they spend time waiting on DB/network, not using CPU
# - Services with higher baseline traffic get higher minReplicas
#
# OPTIMIZED FOR FASTER SCALING:
# - Increased maxReplicas for high-traffic services (API Gateway, Upload-Download)
# - More aggressive scale-up policies (scale faster, more pods at once)
# - Faster scale-down policies (reduce costs when load decreases)

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2  
  maxReplicas: 20  
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70  
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30  
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30  
        - type: Pods
          value: 2  
          periodSeconds: 30
      selectPolicy: Max  
    scaleUp:
      stabilizationWindowSeconds: 0  
      policies:
        - type: Percent
          value: 300 
          periodSeconds: 10  
        - type: Pods
          value: 6  
          periodSeconds: 10  
      selectPolicy: Max  

---
