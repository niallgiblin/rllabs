apiVersion: batch/v1
kind: Job
metadata:
  name: init-db
spec:
  template:
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:13
        command:
          - /bin/sh
          - -c
          - |
            until pg_isready -h postgres -U rllabs -d postgres; do
              echo "Waiting for PostgreSQL to be ready..."
              sleep 2
            done
            echo "PostgreSQL is ready!"
      containers:
      - name: init-db
        image: postgres:13
        env:
          - name: PGPASSWORD
            value: "rllabs_password"
        command:
          - /bin/sh
          - -c
          - |
            echo "Initializing databases..."
            
            # Create upload_download_db if it doesn't exist
            psql -h postgres -U rllabs -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'upload_download_db'" | grep -q 1 || \
            psql -h postgres -U rllabs -d postgres -c "CREATE DATABASE upload_download_db;"
            
            echo "Database initialization complete"
            exit 0
      restartPolicy: OnFailure

