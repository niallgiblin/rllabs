apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          # Redis configuration for better performance under load
          command:
            - redis-server
            - --maxclients
            - "10000"  # Increased from default 10000 to handle more connections
            - --timeout
            - "300"  # 5 minute timeout for idle connections
            - --tcp-keepalive
            - "60"  # Keep connections alive
            - --tcp-backlog
            - "511"  # Connection queue size
            - --maxmemory
            - "200mb"  # 80% of 256Mi memory limit
            - --maxmemory-policy
            - "allkeys-lru"  # Evict least recently used keys when memory full
          readinessProbe:
            exec:
              command:
                - "redis-cli"
                - "ping"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "200m"  # Increased from 100m
              memory: "256Mi"  # Increased from 128Mi
            limits:
              cpu: "500m"  # Increased from 200m
              memory: "512Mi"  # Increased from 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379