apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-download-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upload-download-service
  template:
    metadata:
      labels:
        app: upload-download-service
    spec:
      containers:
        - name: upload-download-service
          image: upload-download-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            # MinIO Configuration
            - name: S3_ENDPOINT_URL
              value: "http://minio:9000"
            - name: S3_ACCESS_KEY
              value: "minioadmin"
            - name: S3_SECRET_KEY
              value: "minioadmin_password"
            - name: S3_BUCKET
              value: "models"
            - name: S3_USE_SSL
              value: "false"
            # PostgreSQL Configuration
            # Use postgres-primary to ensure writes go to primary (not read replicas)
            - name: DATABASE_URL
              value: "postgresql://rllabs:rllabs_password@postgres-primary/upload_download_db"
            # Redis Configuration
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              value: "redis_password"
            - name: REDIS_URL
              value: "redis://:redis_password@redis:6379/0"
            # Redis Sentinel Configuration (for automatic failover)
            - name: REDIS_SENTINEL_HOSTS
              value: "redis-sentinel-0.redis-sentinel:26379,redis-sentinel-1.redis-sentinel:26379,redis-sentinel-2.redis-sentinel:26379"
            - name: REDIS_SENTINEL_MASTER_NAME
              value: "mymaster"
            # RabbitMQ Configuration
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: "admin"
            - name: RABBITMQ_PASS
              value: "admin_password"
            - name: MODEL_CATALOG_URL
              value: "http://model-catalog-service:8000"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15  # Increased from 5s to reduce load
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 30  # Increased from 10s to reduce load
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"  # Increased from 100m to prevent CPU throttling
              memory: "256Mi"
            limits:
              cpu: "1000m"  # Increased from 500m (2x requests minimum)
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: upload-download-service
spec:
  selector:
    app: upload-download-service
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002

